version: '3.8'

services:
  postgres:
    container_name: postgres
    image: postgres:latest
    restart: always
    hostname: localhost
    ports:
      - 5432:5432
    env_file:
    - .env
    networks:
      - app-network

  mongo:
    image: mongo
    restart: always
    env_file:
    - .env
    ports:
      - 27017:27017
    networks:
      - app-network
  
  migration:
    image: ederlyncas/eduedu-escola-backend # TODO: Alterar para imagem oficial de PROD
    depends_on: 
      - postgres
      - mongo
    env_file:
    - .env
    command: >
      sh -c "npx prisma migrate reset --force && npx prisma migrate deploy"
    networks:
      - app-network
  
  backend:
    image: ederlyncas/eduedu-escola-backend # TODO: Alterar para imagem oficial de PROD
    depends_on: 
      - postgres
      - mongo
      - migration
    ports:
      - ${API_PORT}:3000
    env_file:
    - .env
    networks:
      - app-network
  
  admin:
    image: admin:${APP_VERSION}
    build: https://github.com/instituto-abcd/eduedu-escola-admin.git#${APP_VERSION}
    depends_on:
      - backend
    ports:
      - ${ADMIN_PORT}:80
    env_file:
    - .env
    networks:
      - app-network
  
  aluno:
    image: aluno:${APP_VERSION}
    build: https://github.com/instituto-abcd/eduedu-escola-aluno.git#${APP_VERSION}
    depends_on:
      - backend
    ports:
      - ${ALUNO_PORT}:80
    env_file:
    - .env
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
