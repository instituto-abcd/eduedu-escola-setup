version: '3.8'

services:
  postgres:
    container_name: postgres
    image: postgres:latest
    restart: always
    hostname: localhost
    volumes:
      - ${POSTGRES_DATA}:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT}:5432
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - .env
    networks:
      - app-network

  mongo:
    image: mongo:4.4
    restart: always
    volumes:
      - ${MONGODB_DATA}:/data/db
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - .env
    ports:
      - ${MONGO_PORT}:27017
    networks:
      - app-network

  migration:
    image: us-east1-docker.pkg.dev/edueduescola-teste/eduedu-escola-setup/eduedu-escola-backend:${APP_VERSION}
    depends_on:
      - postgres
      - mongo
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - .env
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed"
    networks:
      - app-network

  backend:
    image: us-east1-docker.pkg.dev/edueduescola-teste/eduedu-escola-setup/eduedu-escola-backend:${APP_VERSION}
    restart: always
    depends_on:
      - postgres
      - mongo
      - migration
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${API_PORT}:3000
    volumes:
      - ${FILE_SERVER_DATA}:/usr/src/app/dist/assets-data
    env_file:
      - .env
    networks:
      - app-network

  admin:
    image: admin:${APP_VERSION}
    build: https://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@github.com/instituto-abcd/eduedu-escola-admin.git#${APP_VERSION} # TODO: Remover Token quando os repositórios se tornarem Públicos
    restart: always
    depends_on:
      - backend
    ports:
      - ${ADMIN_PORT}:80
    env_file:
      - .env
    networks:
      - app-network

  aluno:
    image: aluno:${APP_VERSION}
    build: https://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@github.com/instituto-abcd/eduedu-escola-aluno.git#${APP_VERSION} # TODO: Remover Token quando os repositórios se tornarem Públicos
    restart: always
    depends_on:
      - backend
    ports:
      - ${ALUNO_PORT}:80
    env_file:
      - .env
    networks:
      - app-network

  redis:
    image: redis:latest
    restart: always
    hostname: localhost
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 6379:6379
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
