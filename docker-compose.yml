services:
  postgres:
    container_name: postgres
    image: ${POSTGRES_IMAGE:-postgres:17.6}
    restart: always
    hostname: localhost
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT}:5432
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    networks:
      - app-network

  mongo:
    image: mongo:8.0
    restart: always
    volumes:
      - ${MONGODB_DATA}:/data/db
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
    ports:
      - ${MONGO_PORT}:27017
    networks:
      - app-network

  migration:
    image: eduedu-escola-backend:${APP_VERSION}
    restart: "on-failure:5"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - .env
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed"
    networks:
      - app-network

  backend:
    container_name: backend
    image: eduedu-escola-backend:${APP_VERSION}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      migration:
        condition: service_completed_successfully
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${API_PORT}:3000
    volumes:
      - ${FILE_SERVER_DATA}:/usr/src/app/dist/assets-data
      # Os backups gerados pela aplicação ficam nesta pasta, na raiz da
      # instalação. Sem o mapeamento eles ficariam dentro do container e
      # seriam perdidos toda vez que ele fosse recriado — o que acontece em
      # cada atualização de APP_VERSION.
      - ${BACKUP_DATA:-./backup-data}:/usr/src/app/backup
    env_file:
      - .env
    networks:
      - app-network

  admin:
    container_name: admin
    image: eduedu-escola-admin:${APP_VERSION}
    restart: always
    depends_on:
      - backend
    ports:
      - ${ADMIN_PORT}:80
    networks:
      - app-network

  aluno:
    container_name: aluno
    image: eduedu-escola-aluno:${APP_VERSION}
    restart: always
    depends_on:
      - backend
    ports:
      - ${ALUNO_PORT}:80
    networks:
      - app-network

  redis:
    image: redis:latest
    restart: always
    hostname: localhost
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 6379:6379
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
